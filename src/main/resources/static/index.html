/* 저장된 테마를 화면이 그려지기 전에 적용한다 — 새로고침 때 흰 화면이 번쩍이지 않도록 */
(function () {
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) { /* 사생활 보호 모드 */ }
  var dark = saved
    ? saved === 'dark'
    : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>

<!-- 공통(유틸·테마·라우터)을 먼저 읽고, 화면별 스크립트를 이어서 읽는다 -->
<script src="/js/core.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/staff.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/home.js"></script>
<script src="/js/alert.js"></script>

<script>
async function loadNotices() {
  const box = document.getElementById('noticeList');
  try {
    const notices = await api('/api/notices');
    box.className = '';
    box.innerHTML = notices.length === 0 ? '<p class="hint">등록된 공지가 없습니다</p>' :
      notices.map(n => html`<div class="notice-item" style="flex-direction:column; align-items:stretch">
        <div style="display:flex; justify-content:space-between; gap:8px">
          <span style="white-space:pre-wrap">${n.title} ${fmtD(n.eventDate)}${
            n.edited ? html`<button class="edited-btn" onclick="toggleNoticeHistory(${n.id})">수정됨</button>` : ''}</span>
          ${isOwner() ? html`<span style="white-space:nowrap">
              <button class="del" style="color:var(--blue)" onclick="startEditNotice(${n.id})">수정</button>
              <button class="del" onclick="delNotice(${n.id})">x</button></span>` : ''}
        </div>
        <div id="nhist-${n.id}" hidden></div>
        <div id="nedit-${n.id}" hidden></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px">
          ${isOwner() ? html`<span></span>`
            : n.ackedByMe
            ? html`<span class="ack-done">✓ 확인했습니다</span>`
            : html`<button class="ack-btn" onclick="ackNotice(${n.id})">확인했습니다</button>`}
          <span class="hint" style="margin-left:10px; text-align:right">
            확인 ${n.ackCount}명${isOwner() && n.ackedNames.length
              ? html`<br>(${n.ackedNames.join(', ')})` : ''}</span>
        </div>
      </div>`).join('');
    window._notices = notices;
  } catch (e) { box.textContent = '공지를 불러오지 못했습니다'; }
}

/** "수정됨" 배지 클릭 → 수정 전 내용 표시 */
async function toggleNoticeHistory(id) {
  const box = document.getElementById('nhist-' + id);
  if (!box.hidden) { box.hidden = true; return; }
  const history = await api(`/api/notices/${id}/history`);
  box.innerHTML = history.map(h => html`<div class="history-box">
      <div class="meta">수정 전 · ${h.editedBy ?? ''} ${h.editedAt.replace('T', ' ').slice(0, 16)}</div>
      <div class="old">${h.previousTitle} ${fmtD(h.previousEventDate)}</div>
    </div>`).join('');
  box.hidden = false;
}

function startEditNotice(id) {
  const n = (window._notices ?? []).find(x => x.id === id);
  const box = document.getElementById('nedit-' + id);
  if (!box.hidden) { box.hidden = true; return; }
  box.innerHTML = html`
    <textarea id="ne-title-${id}" rows="3" style="margin-top:8px">${n.title}</textarea>
    <div style="display:flex; gap:8px; margin-top:6px">
      <input id="ne-date-${id}" type="date" value="${n.eventDate ?? ''}" style="flex:1">
      <button class="act" style="padding:5px 14px" onclick="saveNotice(${id})">저장</button>
      <button class="act gray" style="padding:5px 12px" onclick="startEditNotice(${id})">취소</button>
    </div>`;
  box.hidden = false;
}
async function saveNotice(id) {
  try {
    await api(`/api/notices/${id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: document.getElementById('ne-title-' + id).value,
        eventDate: document.getElementById('ne-date-' + id).value || null
      })
    });
    loadNotices();
  } catch (e) { showMsg('homeMsg', e.message, false); }
}
async function ackNotice(id) {
  try { await postJson(`/api/notices/${id}/ack`, {}); loadNotices(); }
  catch (e) { showMsg('homeMsg', e.message, false); }
}
async function delNotice(id) {
  await api('/api/notices/' + id, { method: 'DELETE' }); loadNotices();
}

/* ===================== 재고 목록 (품목 클릭 → 입고/폐기) ===================== */
async function viewStock() {
  $view.innerHTML = topbar('재고목록', 'home') +
    html`<p class="hint">부족한 품목이 맨 위로 정렬돼요. 품목을 누르면 바로 입고·폐기·수정할 수 있습니다.</p>
     <div id="stockGrid" class="stock-grid"></div>
     <p id="skMsg" class="msg" style="text-align:center"></p>`;
  loadStockGrid();
}

async function loadStockGrid() {
  const items = await api('/api/items');
  // 부족할수록 위로 — 기준 대비 여유분이 적은 순, 같으면 수량이 적은 순
  items.sort((a, b) =>
    (a.quantity - a.minQuantity) - (b.quantity - b.minQuantity)
    || a.quantity - b.quantity
    || a.name.localeCompare(b.name, 'ko'));
  window._items = items;
  const color = i => i.quantity <= i.minQuantity ? 'red'
                   : i.quantity <= i.minQuantity * 2 ? 'orange' : 'blue';
  document.getElementById('stockGrid').innerHTML = items.map(i => html`
    <div class="stock-card ${color(i)}" style="cursor:pointer" onclick="openStockSheet(${i.id})">
      <span class="nm">${i.name}</span>
      <span class="qt">${i.quantity}${i.unit ?? '개'}</span>
    </div>`).join('');
  refreshAlerts();
}

/* 재고 카드 클릭 시 뜨는 액션 시트 */
let sheetMode = 'in', sheetQty = 1, sheetItem = null;

function openStockSheet(itemId) {
  sheetItem = (window._items ?? []).find(i => i.id === itemId);
  if (!sheetItem) return;
  sheetMode = 'in'; sheetQty = 1;
  const el = document.createElement('div');
  el.className = 'sheet-backdrop';
  el.id = 'stockSheet';
  el.onclick = e => { if (e.target === el) closeStockSheet(); };
  el.innerHTML = html`
    <div class="sheet">
      <h3>${sheetItem.name}</h3>
      <p class="cur">현재 ${sheetItem.quantity}${sheetItem.unit ?? '개'}
         · 최소 ${sheetItem.minQuantity}</p>
      <div class="seg">
        <button id="segIn" class="on" onclick="setSheetMode('in')">입고</button>
        <button id="segOut" onclick="setSheetMode('out')">폐기</button>
        <button id="segSet" onclick="setSheetMode('set')">수정</button>
      </div>
      <p id="sheetHint" class="hint" style="text-align:center; margin:0" hidden>
        고친 뒤의 재고 수량을 입력하세요</p>
      <div class="stepper" style="margin:14px 0">
        <button onclick="bumpSheet(-1)">−</button>
        <input class="num" id="sheetNum" type="number" min="1" value="1" oninput="setSheetQty(this.value)">
        <button onclick="bumpSheet(1)">+</button>
      </div>
      <div id="sheetMinWrap" hidden>
        <label class="field"><span>재고 부족 기준 (이 수량 이하면 빨간색·알림)</span>
          <input id="sheetMinQty" type="number" min="0" value="${sheetItem.minQuantity}"></label>
      </div>
      <div id="sheetReasonWrap" hidden>
        <label class="field"><span>폐기 사유</span>
          <select id="sheetReason">
            <option>유통기한 경과</option><option>파손</option>
            <option>변질</option><option>조리 실수</option><option>기타</option>
          </select></label>
      </div>
      <div id="sheetNoteWrap">
        <label class="field"><span>메모</span>
          <input id="sheetNote" placeholder="예: 정기 발주분"></label>
      </div>
      <div style="display:flex; gap:10px; margin-top:6px">
        <button class="act gray" style="flex:1" onclick="closeStockSheet()">닫기</button>
        <button class="act" id="sheetSubmit" style="flex:2" onclick="submitSheet()">입고 처리</button>
      </div>
      <p id="sheetMsg" class="msg" style="text-align:center"></p>
    </div>`;
  document.body.appendChild(el);
}
function closeStockSheet() { document.getElementById('stockSheet')?.remove(); }

/** 입고 / 폐기 / 수정 — 'set'은 변동량이 아니라 "고친 뒤 수량"을 입력받는다 */
function setSheetMode(mode) {
  sheetMode = mode;
  document.getElementById('segIn').className  = mode === 'in'  ? 'on' : '';
  document.getElementById('segOut').className = mode === 'out' ? 'on dispose' : '';
  document.getElementById('segSet').className = mode === 'set' ? 'on' : '';

  document.getElementById('sheetReasonWrap').hidden = mode !== 'out';
  document.getElementById('sheetNoteWrap').hidden   = mode !== 'in';
  document.getElementById('sheetHint').hidden       = mode !== 'set';
  document.getElementById('sheetMinWrap').hidden    = mode !== 'set';

  // 수정은 현재 수량에서 출발하고 0도 허용, 입고/폐기는 1부터
  const num = document.getElementById('sheetNum');
  num.min = mode === 'set' ? 0 : 1;
  sheetQty = mode === 'set' ? sheetItem.quantity : 1;
  num.value = sheetQty;
  if (mode === 'set') document.getElementById('sheetMinQty').value = sheetItem.minQuantity;

  const btn = document.getElementById('sheetSubmit');
  btn.textContent = mode === 'in' ? '입고 처리' : mode === 'out' ? '폐기 처리' : '수량 저장';
  btn.className = mode === 'out' ? 'act danger' : 'act';
}
function sheetMin() { return sheetMode === 'set' ? 0 : 1; }
function bumpSheet(d) {
  sheetQty = Math.max(sheetMin(), sheetQty + d);
  document.getElementById('sheetNum').value = sheetQty;
}
function setSheetQty(v) {
  const n = Number(v);
  sheetQty = Math.max(sheetMin(), Number.isFinite(n) ? n : sheetMin());
}
async function submitSheet() {
  try {
    // 수정은 품목 정보를, 입고·폐기는 변동 이력을 돌려준다
    if (sheetMode === 'set') {
      const item = await api(`/api/items/${sheetItem.id}/quantity`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          quantity: sheetQty,
          minQuantity: Number(document.getElementById('sheetMinQty').value)
        })
      });
      closeStockSheet();
      await loadStockGrid();
      showMsg('skMsg', `${item.name} → 현재 ${item.quantity}${item.unit ?? '개'}`
        + ` · 부족 기준 ${item.minQuantity}`, true);
      return;
    }

    const tx = sheetMode === 'in'
      ? await postJson('/api/inbound', {
          itemId: sheetItem.id, quantity: sheetQty,
          note: document.getElementById('sheetNote').value
        })
      : await postJson('/api/dispose', {
          itemId: sheetItem.id, quantity: sheetQty,
          reason: document.getElementById('sheetReason').value
        });
    closeStockSheet();
    await loadStockGrid();
    showMsg('skMsg', `${tx.itemName} ${tx.quantityChange > 0 ? '+' : ''}${tx.quantityChange}`
      + ` → 현재 ${tx.quantityAfter}`, true);
  } catch (e) { showMsg('sheetMsg', e.message, false); }
}

/* ===================== 입고 / 폐기 (스테퍼) ===================== */
let stepQty = 1;
function stepperHtml() {
  return html`<div class="stepper">
    <button onclick="bumpQty(-1)">−</button>
    <input class="num" id="stepNum" type="number" min="1" value="${stepQty}" oninput="setStepQty(this.value)">
    <button onclick="bumpQty(1)">+</button>
  </div>`;
}
function bumpQty(d) {
  stepQty = Math.max(1, stepQty + d);
  document.getElementById('stepNum').value = stepQty;
}
function setStepQty(v) {
  stepQty = Math.max(1, Number(v) || 1);
}

async function viewInbound(preselectItemId) {
  stepQty = 1;
  const items = await api('/api/items');
  const preselect = preselectItemId ? Number(preselectItemId) : null;
  $view.innerHTML = topbar('입고', 'home') + html`
    <label class="field"><span>입고 방식</span>
      <select id="ibMode" onchange="toggleIbMode()">
        <option value="existing">기존 품목</option>
        <option value="new">신규 품목 (등록 + 입고)</option>
      </select>
    </label>
    <div id="ibExisting">
      <label class="field"><span>품목</span>
        <select id="ibItem">${items.map(i =>
          html`<option value="${i.id}" ${i.id === preselect ? 'selected' : ''}>${i.name} (현재 ${i.quantity}${i.unit ?? ''})</option>`)}
        </select>
      </label>
    </div>
    <div id="ibNew" hidden>
      <label class="field"><span>신규 품목명</span><input id="ibName" placeholder="예: 사과"></label>
      <label class="field"><span>분류 / 단위</span>
        <div style="display:flex; gap:8px">
          <input id="ibCat" placeholder="분류"><input id="ibUnit" placeholder="단위">
        </div>
      </label>
      <label class="field"><span>최소 수량 (재고 부족 기준)</span>
        <input id="ibMin" type="number" min="0" value="0"></label>
    </div>
    ${stepperHtml()}
    <label class="field"><span>메모</span><input id="ibNote" placeholder="예: 정기 발주분"></label>
    <div style="text-align:center"><button class="act" onclick="submitInbound()">입고 처리</button></div>
    <p id="ibMsg" class="msg" style="text-align:center"></p>`;
}
function toggleIbMode() {
  const isNew = document.getElementById('ibMode').value === 'new';
  document.getElementById('ibExisting').hidden = isNew;
  document.getElementById('ibNew').hidden = !isNew;
}
async function submitInbound() {
  const isNew = document.getElementById('ibMode').value === 'new';
  const payload = { quantity: stepQty, note: document.getElementById('ibNote').value };
  if (isNew) {
    payload.newItemName = document.getElementById('ibName').value;
    payload.category = document.getElementById('ibCat').value;
    payload.unit = document.getElementById('ibUnit').value;
    payload.minQuantity = Number(document.getElementById('ibMin').value || 0);
  } else {
    payload.itemId = Number(document.getElementById('ibItem').value);
  }
  try {
    const tx = await postJson('/api/inbound', payload);
    showMsg('ibMsg', `${tx.itemName} +${tx.quantityChange} → 현재 ${tx.quantityAfter}`, true);
    stepQty = 1; document.getElementById('stepNum').value = 1;
  } catch (e) { showMsg('ibMsg', e.message, false); }
}

async function viewDispose() {
  stepQty = 1;
  const items = await api('/api/items');
  $view.innerHTML = topbar('폐기', 'home') + html`
    <label class="field"><span>품목</span>
      <select id="dpItem">${items.map(i =>
        html`<option value="${i.id}">${i.name} (현재 ${i.quantity}${i.unit ?? ''})</option>`)}
      </select>
    </label>
    ${stepperHtml()}
    <label class="field"><span>폐기 사유</span>
      <select id="dpReason">
        <option>유통기한 경과</option><option>파손</option>
        <option>변질</option><option>조리 실수</option><option>기타</option>
      </select>
    </label>
    <div style="text-align:center"><button class="act danger" onclick="submitDispose()">폐기 처리</button></div>
    <p id="dpMsg" class="msg" style="text-align:center"></p>`;
}
async function submitDispose() {
  try {
    const tx = await postJson('/api/dispose', {
      itemId: Number(document.getElementById('dpItem').value),
      quantity: stepQty,
      reason: document.getElementById('dpReason').value
    });
    showMsg('dpMsg', `${tx.itemName} ${tx.quantityChange} (${tx.note}) → 현재 ${tx.quantityAfter}`, true);
    stepQty = 1; document.getElementById('stepNum').value = 1;
  } catch (e) { showMsg('dpMsg', e.message, false); }
}

/* ===================== 실사 (AI 사진 인식) ===================== */
let currentAudit = null;
let scanShots = [];             // 촬영해 둔 사진들 {blob, url} — 아직 서버에 안 보낸 것
const MAX_SHOTS = 8;

function viewAudit() {
  clearScanShots();
  $view.innerHTML = topbar('실사', 'home') + html`
    <p class="hint">냉장고·주류고·창고를 나눠 찍고 한 번에 인식시키세요.
       AI가 품목과 개수를 세서 기록(장부)과 비교합니다. 미등록 품목은 확정 시 자동 등록됩니다.</p>
    <div style="display:flex; gap:8px; margin-bottom:8px">
      <label class="act" style="cursor:pointer; display:inline-flex; align-items:center; gap:6px">📷 촬영
        <input type="file" accept="image/*" capture="environment" hidden onchange="addScanShots(this)"></label>
      <label class="act gray" style="cursor:pointer; display:inline-flex; align-items:center; gap:6px">🖼️ 파일 선택
        <input type="file" accept="image/*" multiple hidden onchange="addScanShots(this)"></label>
    </div>
    <div id="scanThumbs" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px"></div>
    <div id="scanRun" hidden style="margin-bottom:8px">
      <button class="act" onclick="runScan()">AI 인식 시작</button>
    </div>
    <p id="scanMsg" class="msg"></p>
    <div id="auditLines"></div>
    <div id="auditActions" hidden style="text-align:center; margin:14px 0">
      <button class="act" onclick="confirmAudit()">확정 (재고 반영)</button>
      <button class="act gray" onclick="cancelAudit()">취소</button>
    </div>
    <p id="confirmMsg" class="msg" style="text-align:center"></p>`;
}

function clearScanShots() {
  scanShots.forEach(s => URL.revokeObjectURL(s.url));
  scanShots = [];
}

/** 촬영/선택한 사진을 대기 목록에 담는다 (여러 번 찍어 모을 수 있음) */
async function addScanShots(input) {
  try {
    for (const file of input.files) {
      if (scanShots.length >= MAX_SHOTS) {
        showMsg('scanMsg', `사진은 ${MAX_SHOTS}장까지만 올릴 수 있습니다`, false);
        break;
      }
      const blob = await shrinkImage(file);
      scanShots.push({ blob, url: URL.createObjectURL(blob) });
    }
  } catch (err) { showMsg('scanMsg', err.message, false); }
  finally { input.value = ''; renderScanThumbs(); }
}

/**
 * 폰 사진은 한 장에 3~5MB라 그대로 올리면 업로드도 AI 호출도 느리다.
 * 긴 변 1280px JPEG로 줄여서 보낸다 — 병 개수를 세는 데는 이 해상도로 충분하다.
 */
function shrinkImage(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(src);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('이미지 변환에 실패했습니다')),
                    'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('이미지를 읽을 수 없습니다')); };
    img.src = src;
  });
}

function renderScanThumbs() {
  const box = document.getElementById('scanThumbs');
  if (!box) return;
  box.replaceChildren(...scanShots.map((shot, i) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative';
    const img = document.createElement('img');
    img.src = shot.url;                                  // 로컬 blob — 사용자가 방금 찍은 사진
    img.style.cssText = 'width:72px; height:72px; object-fit:cover; border-radius:8px';
    const del = document.createElement('button');
    del.textContent = '×';
    del.title = '이 사진 빼기';
    del.style.cssText = 'position:absolute; top:-6px; right:-6px; width:22px; height:22px;'
                      + 'border-radius:50%; border:none; background:#333; color:#fff; cursor:pointer';
    del.onclick = () => { URL.revokeObjectURL(shot.url); scanShots.splice(i, 1); renderScanThumbs(); };
    wrap.append(img, del);
    return wrap;
  }));
  document.getElementById('scanRun').hidden = scanShots.length === 0;
}

/** 모아둔 사진을 한 번에 보내 하나의 실사로 인식시킨다 */
async function runScan() {
  if (!scanShots.length) return;
  showMsg('scanMsg', `AI 인식 중... (사진 ${scanShots.length}장)`, true);
  try {
    const fd = new FormData();
    scanShots.forEach((shot, i) => fd.append('images', shot.blob, `scan${i}.jpg`));
    const res = await fetch('/api/audits/scan', { method: 'POST', body: fd });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    clearScanShots();
    renderScanThumbs();
    showMsg('scanMsg', `인식 완료 — ${body.lines.length}개 품목`, true);
    renderAuditLines(body);
  } catch (err) { showMsg('scanMsg', err.message, false); }
}

/** 사장님용 — 날짜를 골라 그날 전 직원의 근태를 보고 시각을 고친다 */

async function saveAttendanceFix(id) {
  const get = k => document.getElementById(`fix-${id}-${k}`).value || null;
  try {
    await api(`/api/attendance/${id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },

async function loadAttendance() {
  const a = await api('/api/attendance/today');
  const t = v => v ? v.slice(0, 5) : '';
  // 자정을 넘겨 일하는 중이면 달력 날짜와 영업일이 다르다 — 어느 날 근무로 기록되는지 밝혀 준다
  const day = document.getElementById('atDay');
  if (day) {
    day.innerHTML = html`${me.displayName}님의 근태 · ${a.workDate}`
      + (a.workDate !== today()
         ? html`<span class="hint"> (심야 근무 — ${fmtD(a.workDate)} 영업일로 기록됩니다)</span>` : '');
  }
  // 각 단계는 하루에 한 번만 — 이미 찍었거나 아직 순서가 아니면 버튼을 잠근다
  const steps = [
    { action: 'clock-in',  label: '출근',      at: a.clockIn,  ready: !a.clockIn },
    { action: 'break',     label: '휴게 시작', at: a.breakAt,  ready: !!a.clockIn && !a.breakAt && !a.clockOut },
    { action: 'break-end', label: '휴게 종료', at: a.breakEnd, ready: !!a.breakAt && !a.breakEnd && !a.clockOut },
    { action: 'clock-out', label: '퇴근',      at: a.clockOut,
      ready: !!a.clockIn && !a.clockOut && (!a.breakAt || !!a.breakEnd) }
  ];
  // 아직 안 찍었으면 라벨만, 찍었으면 라벨(작게) + 기록된 시각(크게)
  document.getElementById('clockList').innerHTML = steps.map(s => html`
    <button class="clock-btn${s.at ? ' done' : ''}" ${s.ready ? '' : 'disabled'}
            onclick="clock('${s.action}')">
      ${s.at
        ? html`<span class="clock-cap">${s.label}</span><span class="clock-at">${t(s.at)}</span>`
        : html`<span class="clock-label">${s.label}</span>`}
    </button>`).join('')
    + (a.locationLabel ? html`<p class="hint" style="text-align:center; margin-top:6px">
         출근 위치 — ${a.locationLabel}</p>` : '');
}
let clocking = false;
async function clock(action) {
  // 위치 확인에 몇 초가 걸리는 동안 버튼이 살아 있으면 연타로 중복 요청이 쌓인다.
  if (clocking) return;
  clocking = true;
  document.querySelectorAll('#clockList .clock-btn').forEach(b => b.disabled = true);
  try {
    // 출근만 위치를 확인한다. 위치를 못 받아도 출근은 그대로 진행되고 '미확인'으로 기록된다.
    if (action === 'clock-in') showMsg('atMsg', '위치 확인 중...', true);
    const where = action === 'clock-in' ? await currentPosition() : {};
    const a = await postJson('/api/attendance/clock', { action, ...where });
    if (action === 'clock-in') {
      showMsg('atMsg', a.locationLabel ?? '출근했습니다',
              a.locationCheck === 'GPS_OK' || a.locationCheck === 'IP_OK');
    }
  } catch (e) { showMsg('atMsg', e.message, false); }
  finally { clocking = false; loadAttendance(); }   // 다시 그리면서 버튼 잠금도 풀린다
}

/**
 * 현재 위치. 권한 거부·미지원·시간초과면 좌표 없이 진행한다 —
 * 위치가 없다고 출근을 막으면 GPS가 안 잡히는 지하 매장에서 아무도 못 찍는다.
 * (https 또는 localhost 에서만 동작한다. http로 접속하면 브라우저가 요청 자체를 거부한다)
 */
function currentPosition() {
  if (!navigator.geolocation) return Promise.resolve({});
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
      () => resolve({}),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });
}

    await postJson(`/api/reports/${reportId}/comments`, { content: input.value.trim() });
    input.value = '';
    loadComments(reportId);
  } catch (e) { showMsg('cmMsg', e.message, false); }
}

/* ===================== 예약 ===================== */
const TIME_SLOTS = ['17:00','18:00','19:00','20:00','21:00','22:00'];
let draft = { date: null, timeSlot: null, people: null, tableIds: [], customerName: '', courseName: null };

/** 예약 메뉴 — 코스 예약 / 코스 없이 예약 / 예약 확인으로 분기 */
async function viewReserve() {
  $view.innerHTML = topbar('예약', 'home') + html`
    <div class="menu-btns">
      <button class="act" onclick="go('course-list')">코스 예약</button>
      <button class="act" onclick="draft.courseName=null; go('reserve-new')">코스 없이 예약</button>
      <button class="act gray" onclick="go('reserve-list')">예약 확인</button>
    </div>`;
}

/**
 * 코스를 "음료·술 무제한 / 무제한 아님" 두 묶음으로 나눠 그린다.
 * 초록 줄은 묶음 제목이라 누를 수 없고, 실제 코스(파란 줄)만 선택 대상이다.
 * @param renderItem 코스 하나를 <li>로 그리는 함수 (화면마다 내용이 다름)
 */
function courseGroupsHtml(courses, renderItem) {
  const groups = [
    { accent: 'refill', title: '음료, 술 무제한 코스', items: courses.filter(c => c.unlimitedRefill) },
    { accent: 'normal', title: '일반 코스',           items: courses.filter(c => !c.unlimitedRefill) }
  ];
  return html`<ul class="plain course-list">${groups.map(g => html`
      <li class="course-group-head cg-${g.accent}">${g.title}</li>
      ${g.items.length === 0
        ? html`<li class="course-group-empty">등록된 코스가 없습니다</li>`
        : g.items.map(c => renderItem(c, g))}`)}</ul>`;
}

/** 코스 예약 — 코스를 먼저 고르면 예약 받기 화면으로 이동 */
async function viewCourseList() {
  $view.innerHTML = topbar('코스 예약', 'reserve')
    + html`<p class="page-sub">예약하실 코스를 선택해주세요</p>`
    + html`<div id="courseList">불러오는 중...</div>`;
  const box = document.getElementById('courseList');
  try {
    const s = await api('/api/store');
    box.innerHTML = s.courses.length === 0
      ? '<p class="hint">등록된 코스가 없습니다. 가게 설정에서 코스를 추가해 주세요.</p>'
      : courseGroupsHtml(s.courses, (c, g) => html`
          <li class="course-row course-item cg-${g.accent}"
              data-name="${c.name}" onclick="pickCourse(this)">
            <span class="c-name">${c.name}</span>
            <span class="c-right"><span class="c-radio" aria-hidden="true"></span></span>
          </li>`);
  } catch (e) {
    box.innerHTML = html`<p class="msg error">${e.message}</p>`;
  }
}
function pickCourse(el) { draft.courseName = el.dataset.name; go('reserve-new'); }
/** 예약 확인 — 날짜별로 묶어서 보여주고, 누르면 상세로 */
async function viewReserveList() {
  $view.innerHTML = topbar('예약 확인', 'reserve') + html`<div id="rlist">불러오는 중...</div>`;
  try {
    const list = await api('/api/reservations/upcoming');
    const box = document.getElementById('rlist');
    if (list.length === 0) {
      box.innerHTML = '<p class="hint">예정된 예약이 없습니다.</p>';
      return;
    }
    let rows = '', lastDate = null;
    for (const r of list) {
      if (r.reserveDate !== lastDate) {
        lastDate = r.reserveDate;
        rows += html`<div class="date-head">${fmtD(r.reserveDate)}</div>`;
      }
      rows += html`<div class="resv-row" onclick="go('reservation', ${r.id})">
          <span>${r.customerName || '(이름 없음)'}${r.courseName ? ' · ' + r.courseName : ''}</span>
          <span>${r.people}명
            ${r.status === 'ACTIVE'
              ? html`<span class="badge-seated">사용중</span>`
              : html`<span class="badge-free">공석</span>`}</span>
        </div>`;
    }
    box.innerHTML = rows;
  } catch (e) {
    document.getElementById('rlist').innerHTML =
      html`<p class="msg error">${e.message}</p>`;
  }
}

/** 예약 상세 — 예약자·날짜·시간·인원·테이블 + 공석 처리 / 예약 취소 */
async function viewReservationDetail(id) {
  let r;
  try { r = await api('/api/reservations/' + id); }
  catch (e) { $view.innerHTML = topbar('예약 확인', 'reserve-list')
      + html`<p class="msg error">${e.message}</p>`; return; }

  const [, mm, dd] = r.reserveDate.split('-');
  $view.innerHTML = topbar('예약 확인', 'reserve-list') + html`
    <div class="sketch resv-detail">
      <div class="who">${r.customerName || '(이름 없음)'}</div>
      <div>${r.courseName || '코스 없이 예약'}</div>
      <div>${Number(mm)}월 ${Number(dd)}일</div>
      <div>${r.timeSlot}</div>
      <div>${r.people}명</div>
      <div>테이블 ${r.tableNumbers.join(', ')}번
        <span class="hint">(총 ${r.totalCapacity}석)</span></div>
      <div>${r.status === 'ACTIVE'
        ? html`<span class="badge-seated">사용중</span>`
        : html`<span class="badge-free">공석</span>`}</div>
      <div style="text-align:right; margin-top:14px">
        ${r.status === 'ACTIVE'
          ? html`<button class="ack-btn" onclick="releaseFromDetail(${r.id})">공석 처리</button>
                 <button class="act danger" style="padding:6px 16px"
                         onclick="cancelFromDetail(${r.id})">예약취소</button>` : ''}
      </div>
    </div>
    <p id="rdMsg" class="msg" style="text-align:center"></p>`;
}
async function releaseFromDetail(id) {
  try {
    await postJson(`/api/reservations/${id}/release`, {});
    viewReservationDetail(id);
  } catch (e) { showMsg('rdMsg', e.message, false); }
}
async function cancelFromDetail(id) {
  if (!confirm('이 예약을 취소할까요?')) return;
  try {
    await api('/api/reservations/' + id, { method: 'DELETE' });
    go('reserve-list');
  } catch (e) { showMsg('rdMsg', e.message, false); }
}

/** 예약 받기 — 날짜·시간·인원·테이블을 골라 새 예약을 등록 (코스 예약이면 draft.courseName이 채워져 있음) */
async function viewReserveNew() {
  draft.date ??= today();
  $view.innerHTML = topbar(draft.courseName ? '코스 예약' : '코스 없이 예약', 'reserve') + html`
    ${draft.courseName ? html`<div class="sketch2" style="padding:10px 14px; margin-bottom:14px; text-align:center; font-weight:700">${draft.courseName}</div>` : ''}
    <label class="field"><span>날짜</span>
      <input id="rvDate" type="date" value="${draft.date}" onchange="draft.date=this.value; draft.tableIds=[]; render()"></label>
    <label class="field"><span>시간</span>
      <select id="rvTime" onchange="draft.timeSlot=this.value; draft.tableIds=[]">
        <option value="">선택</option>
        ${TIME_SLOTS.map(t => html`<option ${draft.timeSlot === t ? 'selected' : ''}>${t}</option>`)}
      </select></label>
    <label class="field"><span>인원</span>
      <select id="rvPeople" onchange="draft.people=Number(this.value)">
        <option value="">선택</option>
        ${[1,2,3,4,5,6,7,8].map(n => html`<option ${draft.people === n ? 'selected' : ''} value="${n}">${n}명</option>`)}
      </select></label>
    <label class="field"><span>예약자명</span>
      <input id="rvName" value="${draft.customerName}" placeholder="예약자 이름"
             oninput="draft.customerName=this.value"></label>
    <button class="act gray" onclick="openTableMap()">테이블 선택
      ${draft.tableIds.length ? ` — ${draft.tableIds.join(', ')}번` : ''}</button>
    <p class="hint" style="margin-top:6px">인원이 많으면 테이블을 여러 개 선택해 붙여 앉힐 수 있습니다.
       배정된 테이블은 <strong>공석 처리하기 전까지</strong> 계속 사용중으로 표시됩니다.</p>
    <div style="text-align:center; margin-top:20px">
      <button class="act" onclick="submitReserve()">확정</button>
    </div>
    <p id="rvMsg" class="msg" style="text-align:center"></p>
    <h3 style="margin-top:26px">이 날짜의 예약</h3>
    <ul class="plain" id="rvList">불러오는 중...</ul>`;
  loadDayReservations();
}
async function loadDayReservations() {
  const list = await api('/api/reservations?date=' + draft.date);
  document.getElementById('rvList').innerHTML = list.length === 0
    ? '<li class="hint">예약이 없습니다</li>'
    : list.map(r => html`<li>
        <div>${r.timeSlot} · 테이블 ${r.tableNumbers.join(', ')}번 · ${r.people}명
          ${r.customerName ? '· ' + r.customerName : ''}
          ${r.courseName ? '· ' + r.courseName : ''}
          ${r.status === 'ACTIVE'
            ? html`<span class="badge-seated">사용중</span>`
            : html`<span class="badge-free">공석</span>`}</div>
        <div style="margin-top:4px">
          ${r.status === 'ACTIVE'
            ? html`<button class="ack-btn" onclick="releaseReserve(${r.id})">공석 처리</button>
                   <button class="del" style="border:none;background:none;color:var(--red);cursor:pointer;font-family:inherit"
                           onclick="cancelReserve(${r.id})">예약 취소</button>` : ''}
        </div></li>`).join('');
}

/** 손님이 나간 뒤 — 테이블을 비워 다시 배정 가능하게 만든다 */
async function releaseReserve(id) {
  try {
    await postJson(`/api/reservations/${id}/release`, {});
    showMsg('rvMsg', '공석 처리했습니다. 이제 이 테이블을 다시 배정할 수 있어요.', true);
    loadDayReservations();
  } catch (e) { showMsg('rvMsg', e.message, false); }
}
async function cancelReserve(id) {
  await api('/api/reservations/' + id, { method: 'DELETE' });
  loadDayReservations();
}
function openTableMap() {
  if (!draft.timeSlot) { showMsg('rvMsg', '시간을 먼저 선택하세요.', false); return; }
  go('tables');
}

async function viewTables() {
  if (!draft.timeSlot) { go('reserve-new'); return; }
  $view.innerHTML = topbar(`테이블 선택 (${fmtD(draft.date)} ${draft.timeSlot})`, 'reserve-new')
    + html`<div id="tableMapWrap"></div>`;
  // 코스를 같이 넘겨야 서버가 이 예약이 끝나는 시각을 알고, 그 뒤에 잡힌 예약과 안 겹치는 테이블을 열어 준다
  window._tables = await api(`/api/tables?date=${draft.date}&timeSlot=${draft.timeSlot}`
    + (draft.courseName ? `&courseName=${encodeURIComponent(draft.courseName)}` : ''));
  renderTableMap();
}

/** 여러 테이블을 눌러 선택/해제 — 정원 합계가 인원 이상이면 확정 가능 */
function renderTableMap() {
  const tables = window._tables ?? [];
  const picked = tables.filter(t => draft.tableIds.includes(t.id));
  const seats = picked.reduce((s, t) => s + t.capacity, 0);
  const need = draft.people ?? 0;
  const enough = picked.length > 0 && seats >= need;

  document.getElementById('tableMapWrap').innerHTML = html`
    <p class="hint" style="text-align:center">
      빨간 테이블은 사용중(공석 처리 전) · 여러 개를 눌러 붙여 앉힐 수 있습니다</p>
    <div class="table-grid">` + tables.map(t => html`
      <button class="tbl-cell ${t.reserved ? 'reserved' : ''} ${draft.tableIds.includes(t.id) ? 'sel' : ''}"
              ${t.reserved ? 'disabled' : html`onclick="toggleTable(${t.id})"`}>
        <span class="tno">${t.number}</span><small>${t.capacity}인</small>
      </button>`).join('') + html`</div>
    <div class="sketch2" style="padding:12px; margin-top:14px; text-align:center">
      <div style="font-weight:700; font-size:1.1rem">
        선택 ${picked.length}개 · 총 ${seats}석 / 인원 ${need}명
        <span style="color:${enough ? 'var(--green)' : 'var(--red)'}">
          ${picked.length === 0 ? '' : (enough ? '✓' : '자리 부족')}</span>
      </div>
      <div class="hint">${picked.length
        ? '테이블 ' + picked.map(t => t.number).sort((a,b)=>a-b).join(', ') + '번'
        : '테이블을 선택하세요'}</div>
      <button class="act" style="margin-top:10px" onclick="go('reserve-new')">선택 완료</button>
    </div>`;
}
function toggleTable(id) {
  const i = draft.tableIds.indexOf(id);
  if (i >= 0) draft.tableIds.splice(i, 1); else draft.tableIds.push(id);
  renderTableMap();
}

/** 화면 중앙에 뜨는 확정 팝업 — 1.8초 뒤 자동으로 닫히고, 눌러도 닫힌다 */
function showToast(text, icon = '✅') {
  const back = document.createElement('div');
  back.className = 'toast-backdrop';
  back.innerHTML = html`<div class="toast-pop"><div class="ic">${icon}</div><div class="tx">${text}</div></div>`;
  const close = () => back.remove();
  back.addEventListener('click', close);
  document.body.appendChild(back);
  setTimeout(close, 1800);
}
async function submitReserve() {
  if (!draft.timeSlot || !draft.people || draft.tableIds.length === 0) {
    showMsg('rvMsg', '시간·인원·테이블을 모두 선택하세요.', false); return;
  }
  try {
    await postJson('/api/reservations', {
      reserveDate: draft.date, timeSlot: draft.timeSlot, people: draft.people,
      tableIds: draft.tableIds, customerName: draft.customerName, courseName: draft.courseName
    });
    showToast('예약이 확정되었습니다', '🎉');
    showMsg('rvMsg', '예약이 확정되었습니다.', true);
    draft.tableIds = []; draft.timeSlot = null; draft.people = null;
    loadDayReservations();
  } catch (e) { showMsg('rvMsg', e.message, false); }
}
</script>
